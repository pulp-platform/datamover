package:
  name: datamover
  authors:
    - "Francesco Conti <f.conti@unibo.it>"
    - "Sergio Mazzola <smazzola@iis.ee.ethz.ch>"
    - "Cyrill Durrer <cdurrer@iis.ee.ethz.ch>"
    - "Lionnus Kesting <lkesting@iis.ee.ethz.ch>"

dependencies:
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git", version: 1.39.0 }
  hwpe-stream: { git: "https://github.com/pulp-platform/hwpe-stream.git", rev: 19c68aa49b2d60792f115e939adca72360752f6e } # branch: lkesting/partial_tiles
  hci:         { git: "https://github.com/pulp-platform/hci.git", rev: 8793cf651c9d9fe4f3aa78f53d2dabddaeb56353 } # branch: lkesting/konark
  hwpe-ctrl:   { git: "https://github.com/pulp-platform/hwpe-ctrl.git", version: 3.1.1 } # SystemRDL-based hwpe_ctrl_target flow
  ibex:        { git: "https://github.com/pulp-platform/ibex.git", rev: "pulpissimo-v6.1.2", target: datamover_standalone } # RISC-V core for testbench

sources:
  # Level 0
  - rtl/ctrl/regif/datamover_regif_pkg.sv  # SystemRDL-generated register file package
  # Level 1
  - rtl/datamover_package.sv               # sizes ctrl_engine_t from the regif field widths
  - rtl/ctrl/regif/datamover_regif.sv      # SystemRDL-generated register file
  - rtl/datamover_buffer.sv
  - rtl/datamover_im2col_ctrl.sv
  - rtl/datamover_engine.sv
  - rtl/datamover_streamer.sv
  # Level 2
  - rtl/ctrl/datamover_ctrl.sv             # hwpe_ctrl_target + regif + job FSM
  # Level 3
  - rtl/datamover_top.sv
  # Level 4
  - rtl/datamover_top_wrap.sv
  - target: all(datamover_standalone,simulation)
    files:
      - rtl/verif/tb_dummy_memory.sv
      - rtl/verif/tb_datamover.sv

  # GF12 tech cells
  - target: all(datamover_standalone,gf12)
    files:
      - nonfree/gf12/sourcecode/tc_clk.sv
