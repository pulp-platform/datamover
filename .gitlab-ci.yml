variables:
  GIT_SUBMODULE_STRATEGY: none
  PARALLEL: "4"
  TIMEOUT: "300"
  # Skip debug_logs creation for CI
  NO_DEBUG: "1"
  UV_CACHE_DIR: $CI_BUILDS_DIR/../cache/uv

stages:
  - setup
  - test
  - coverage

setup:
  stage: setup
  script:
    - unset VIRTUAL_ENV
    - export UV_LINK_MODE=hardlink
    - uv sync --frozen --python 3.11
    - bender checkout
  artifacts:
    expire_in: 1 hour
    paths:
      - .bender/

.py-setup:
  before_script:
    - unset VIRTUAL_ENV
    - export UV_LINK_MODE=hardlink
    - uv sync --frozen --python 3.11
    - source .venv/bin/activate

.test-template:
  extends: .py-setup
  stage: test
  needs:
    - setup
  script:
    - make run-test TEST_JSON=${TEST_JSON} PARALLEL=${PARALLEL} TIMEOUT=${TIMEOUT} NO_DEBUG=${NO_DEBUG}
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - reports/
    reports:
      junit: reports/junit/${SUITE_NAME}.xml

# Coverage suites run on VCS. Only the default HW config gives a merged number.
.cov-test-template:
  extends: .test-template
  variables:
    ENGINE: vcs
    COV: "1"
  script:
    - make run-test TEST_JSON=${TEST_JSON} PARALLEL=${PARALLEL} TIMEOUT=${TIMEOUT} NO_DEBUG=${NO_DEBUG} || RC=$?
    - make vcs-cov-export COV_NAME=${SUITE_NAME}
    - exit ${RC:-0}
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - reports/
      - simulation/vcs/cov_export/
    reports:
      junit: reports/junit/${SUITE_NAME}.xml

test:transpose:
  extends: .test-template
  variables:
    TEST_JSON: tests/transpose.json
    SUITE_NAME: transpose

test:copy:
  extends: .test-template
  variables:
    TEST_JSON: tests/copy.json
    SUITE_NAME: copy

test:cim:
  extends: .test-template
  variables:
    TEST_JSON: tests/cim.json
    SUITE_NAME: cim

test:konark_ci:
  extends: .cov-test-template
  variables:
    TEST_JSON: tests/konark_ci.json
    SUITE_NAME: konark_ci

test:chained:
  extends: .test-template
  variables:
    TEST_JSON: tests/chained.json
    SUITE_NAME: chained

test:stallability:
  extends: .test-template
  variables:
    TEST_JSON: tests/stallability.json
    SUITE_NAME: stallability

test:im2col:
  extends: .cov-test-template
  variables:
    TEST_JSON: tests/im2col.json
    SUITE_NAME: im2col

test:mvit_im2col:
  extends: .cov-test-template
  variables:
    TEST_JSON: tests/mvit_im2col.json
    SUITE_NAME: mvit_im2col

coverage-default:
  extends: .py-setup
  stage: coverage
  when: always
  needs:
    - test:konark_ci
    - test:im2col
    - test:mvit_im2col
  script:
    - make vcs-cov-report COV_NAME=default VCS_COV_DIRS='simulation/vcs/cov_export/*.vdb'
  coverage: '/^Total coverage: (\d+\.\d+)%$/'
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - simulation/vcs/cov/default/
