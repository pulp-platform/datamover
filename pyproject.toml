[project]
name = "datamover-hwpe"
version = "0.1.0"
description = "Datamover HWPE verification and tooling"
requires-python = ">=3.11,<3.12"
dependencies = [
    "junit_xml==1.9",
    "numpy>=1.26,<2.0",
    "peakrdl>=1.5",
    "rich==13.9.4",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
